name: reto-eventos
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "RetoLocal_2026!"
    ports:
      - "127.0.0.1:21433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "RetoLocal_2026!"
    volumes:
      - ./infra/create-database.sql:/init.sql:ro
    entrypoint: [/bin/sh, -c]
    command: ['/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /init.sql']
    logging: *logging
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:29092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/sh, -c]
    command: ['/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic record-ready-topic-v2 --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=604800000']
    logging: *logging
  producer:
    build: .
    image: reto/ms-batch-producer:1.0.0
    depends_on:
      init-db:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=reto_db;encrypt=true;trustServerCertificate=true
      MSSQL_SA_PASSWORD: "RetoLocal_2026!"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped
    stop_grace_period: 75s
    logging: *logging
  consumer:
    build: ../ms-event-consumer
    image: reto/ms-event-consumer:1.0.0
    depends_on:
      producer:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=reto_db;encrypt=true;trustServerCertificate=true
      MSSQL_SA_PASSWORD: "RetoLocal_2026!"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONCURRENCY: 3
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    stop_grace_period: 75s
    logging: *logging
  monitor:
    build: ../ms-monitoreo
    image: reto/ms-monitoreo:1.0.0
    depends_on:
      consumer:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=reto_db;encrypt=true;trustServerCertificate=true
      MSSQL_SA_PASSWORD: "RetoLocal_2026!"
    ports:
      - "127.0.0.1:8083:8080"
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *logging

volumes:
  sqlserver_data:
  kafka_data:
  uploads:
