spring.application.name=ms-event-consumer
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:21433;databaseName=reto_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=sa
spring.datasource.password=RetoLocal_2026!
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-sqlserver.sql
spring.sql.init.separator=^^^
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:record-processor-v2}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=25
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.consumer.fetch-min-size=1
spring.kafka.consumer.fetch-max-wait=100ms
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=batch
spring.kafka.listener.concurrency=${KAFKA_CONCURRENCY:3}
spring.kafka.listener.auto-startup=${KAFKA_AUTO_STARTUP:true}
app.kafka.topic.record-ready=record-ready-topic-v2
app.processing.delay-ms=${PROCESSING_DELAY_MS:10}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s
